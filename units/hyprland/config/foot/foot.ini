# Foot settings: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
# Colors come from the current Archype theme.
include=~/.config/archype/current/theme/foot.ini

font=CaskaydiaMono Nerd Font:size=9
pad=14x14

[colors-dark]
alpha=0.98

[colors-light]
alpha=0.98

[text-bindings]
# Shift+Enter sends Esc+Enter (like Alt+Enter): a new line instead of submit in Claude Code
\x1b\x0d=Shift+Return
